# Build the whole m68k-amigaos toolchain, on dispatch, from release.yml,
# or for a labelled pull request. Nothing builds on a plain push: label a
# pull request here, or in a module repository whose toolchain-ci.yml
# calls this workflow with its branch swapped in, with a ci-* tag. The
# label picks what to build:
#   ci-linux         - the Linux toolchain (plus the amigaos.exp testsuite)
#   ci-linux-arm     - the same on an arm64 Linux runner
#   ci-macos         - the macOS toolchain
#   ci-amigaos       - the AmigaOS-hosted toolchain (builds the Linux
#                      cross toolchain first, to bootstrap from)
#   ci-mingw         - the MinGW-hosted toolchain
#   ci-check-c       - make check-c, the gcc C testsuite, on an arm64 runner
#   ci-check-c++     - make check-c++, the g++ testsuite (slow)
#   ci-check-c-newlib, ci-check-c++-newlib - the same two, with the tests
#                      linked against newlib instead of libnix
#   ci-check-newlib  - make check-newlib, newlib's own testsuite
# The ci-check-* labels build only what the tests need (make min): no gdb,
# SDKs, vbcc, zlib/libpng or release tarball.
# Re-add the label to rebuild after pushing new commits.

name: Bootstrap toolchain

on:
  workflow_dispatch:
    inputs:
      gcc_version:
        description: gcc version to build (branch amiga<version>)
        default: "16.2"
        required: true
      run_testsuite:
        description: run the gcc testsuite under the simulator
        type: boolean
        default: false
      run_cxx_testsuite:
        description: run the g++ testsuite under the simulator (slow)
        type: boolean
        default: false
      simulator:
        description: "simulator for the target testsuite: volamos or vamos"
        default: volamos
      amitools_git:
        description: pip source for amitools (only used with simulator=vamos)
        default: git+https://github.com/AmigaPorts/amitools.git
      runner:
        description: runner label (e.g. papert for self-hosted)
        default: ubuntu-24.04
      repos:
        description: "module overrides, space separated: sfdc=branch or sfdc=URL#branch"
        default: ""
      tag:
        description: "release tag: build every module at m68k-amigaos-gcc-<tag> instead of its branch"
        default: ""
      build_hosted:
        description: build AmigaOS and MinGW hosted toolchains
        type: boolean
        default: true
  # same inputs again: workflow_call, used by release.yml, does not
  # share the workflow_dispatch input declarations
  workflow_call:
    inputs:
      gcc_version:
        type: string
        default: "16.2"
      run_testsuite:
        type: boolean
        default: false
      run_cxx_testsuite:
        type: boolean
        default: false
      simulator:
        type: string
        default: volamos
      amitools_git:
        type: string
        default: git+https://github.com/AmigaPorts/amitools.git
      # empty, so a module repo's ci-* label picks the runner as here
      runner:
        type: string
        default: ""
      repos:
        type: string
        default: ""
      tag:
        type: string
        default: ""
      build_hosted:
        type: boolean
        default: true
      # a module repo's own CI calls this workflow to build its PR: it
      # points checkout_repo/checkout_ref at this build tree (instead of
      # the caller) and names the module in repos. Empty for every other
      # trigger, where checkout falls back to this repo at the event ref.
      checkout_repo:
        type: string
        default: ""
      checkout_ref:
        type: string
        default: ""
  # the ci-* labels listed at the top of this file
  pull_request:
    types: [labeled]

jobs:
  # What to build is decided once, here, and shared as the .repos of the
  # build jobs below: each runs on its own runner with its own checkout, and
  # a module branch could move between them.  A release pins every module to
  # the tag that release-tag made in it, named after this repository's; a
  # module without the tag fails the clone.
  refs:
    name: Select module refs
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["ci-linux", "ci-linux-arm", "ci-macos", "ci-amigaos", "ci-mingw", "ci-check-c", "ci-check-c++", "ci-check-c-newlib", "ci-check-c++-newlib", "ci-check-newlib"]'),
               github.event.label.name)
    runs-on: ubuntu-24.04
    env:
      GCC_VER: ${{ inputs.gcc_version || '16.2' }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.checkout_repo }}
          ref: ${{ inputs.checkout_ref }}

      - name: Pin the module refs
        run: |
          if [ -z "$TAG" ]; then
            make branch branch=amiga$GCC_VER mod=gcc
          else
            make v ref=m68k-amigaos-gcc-$TAG
          fi
          cat .repos

      - uses: actions/upload-artifact@v7
        with:
          name: module-refs
          path: .repos
          include-hidden-files: true

  build:
    # each ci-* label starts its own run of this job: name it after the
    # label, or a PR's checks list keeps only the latest of them
    name: build (${{ github.event.label.name || github.event_name }})
    needs: refs
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["ci-linux", "ci-linux-arm", "ci-macos", "ci-amigaos", "ci-check-c", "ci-check-c++", "ci-check-c-newlib", "ci-check-c++-newlib", "ci-check-newlib"]'),
               github.event.label.name)
    # the testsuites run on arm64, whose 4 vCPUs build and test faster
    runs-on: >-
      ${{ inputs.runner
          || (github.event.label.name == 'ci-macos' && 'macos-15')
          || (github.event.label.name == 'ci-linux-arm' && 'ubuntu-24.04-arm')
          || (startsWith(github.event.label.name, 'ci-check') && 'ubuntu-24.04-arm')
          || 'ubuntu-24.04' }}
    timeout-minutes: 300
    env:
      RUN_TESTSUITE: ${{ inputs.run_testsuite || github.event.label.name == 'ci-check-c' || github.event.label.name == 'ci-check-c-newlib' }}
      RUN_TESTSUITE_CXX: ${{ inputs.run_cxx_testsuite || github.event.label.name == 'ci-check-c++' || github.event.label.name == 'ci-check-c++-newlib' }}
      RUN_TESTSUITE_NEWLIB: ${{ github.event.label.name == 'ci-check-newlib' }}
      # the check labels build only the compiler and its runtimes; the
      # steps that need the rest of the distribution check for 'all'
      BUILD_TARGET: ${{ startsWith(github.event.label.name, 'ci-check') && 'min' || 'all' }}
      # the two simulators are kept side by side so their results can be
      # compared; SIMULATOR picks one and BOARD is the baseboards/ file for
      # it. The -c-newlib and -c++-newlib labels take the volamos board that
      # links newlib.
      SIMULATOR: ${{ inputs.simulator || 'volamos' }}
      BOARD: ${{ (inputs.simulator || 'volamos') == 'vamos' && 'amigaos' || endsWith(github.event.label.name, '-c-newlib') && 'volamos-newlib' || endsWith(github.event.label.name, '-c++-newlib') && 'volamos-newlib' || 'volamos' }}
      AMITOOLS_GIT: ${{ inputs.amitools_git || 'git+https://github.com/AmigaPorts/amitools.git' }}
      # not GCC_VERSION: the Makefile reads that from gcc's BASE-VER
      # (16.2.1b) and derives the lib/gcc/<target>/<version> directory (16)
      GCC_VER: ${{ inputs.gcc_version || '16.2' }}
      # mirrors to try, in order, before aminet.net itself; see
      # https://wiki.aminet.net/Mirrors (some serve the tree under /aminet)
      AMINET_MIRROR: http://us4.aminet.net/aminet http://de4.aminet.net
    steps:
      # empty repository/ref check out this repo at the triggering event's
      # ref (the normal PR, dispatch and release paths); a module caller
      # overrides them to build this tree with its module swapped in
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.checkout_repo }}
          ref: ${{ inputs.checkout_ref }}
          # the Makefile stamps the tools with git describe --tags
          fetch-depth: 0

      # PREFIX reaches every make invocation through the environment
      - name: Set prefix
        run: echo "PREFIX=$HOME/m68k-amigaos-gcc-$GCC_VER" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner image ships Google Chrome and its apt repository,
          # which nothing here uses; while Google republishes it, its index
          # fails the hash check and takes apt-get update down with it.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential ca-certificates curl flex \
            gettext git rsync xz-utils

      # Apple ships old or BSD versions of most build tools; put the brew
      # GNU ones first on PATH under their plain names (gnubin) so the
      # build machinery does not need BSD workarounds
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison coreutils flex gettext \
            gnu-sed gnu-tar grep make xz
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          for pkg in coreutils gnu-sed gnu-tar grep make; do
            echo "$(brew --prefix $pkg)/libexec/gnubin" >> $GITHUB_PATH
          done

      # runners of one label differ in CPU, so record it to compare timings
      - name: Set build parallelism
        run: |
          nproc=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          echo "NPROC=$nproc" >> $GITHUB_ENV
          cpu=$(lscpu 2>/dev/null | sed -n 's/^Model name: *//p' | head -1)
          cpu=${cpu:-$(sysctl -n machdep.cpu.brand_string 2>/dev/null)}
          echo "CPU: $cpu, $nproc vCPUs" | tee -a $GITHUB_STEP_SUMMARY

      - name: Download the module refs
        uses: actions/download-artifact@v7
        with:
          name: module-refs

      # build with a pull request from another module's repo: each word in
      # repos is module=branch, or module=URL#branch for a fork
      - name: Override module repos
        if: inputs.repos != ''
        env:
          REPOS: ${{ inputs.repos }}
        run: sh .github/scripts/override-repos.sh

      - name: Fetch sources
        run: make update

      # provenance for the whole build, independent of the testsuite
      - name: Record module revisions
        run: scripts/manifest --markdown >> $GITHUB_STEP_SUMMARY

      - name: Build toolchain
        run: make -j $NPROC $BUILD_TARGET

      # a libpython dependency would tie the release to this runner's distro
      - name: Check that gdb does not link libpython
        if: runner.os == 'Linux' && env.BUILD_TARGET == 'all'
        run: |
          ldd "$PREFIX/bin/m68k-amigaos-gdb" > gdb-ldd.txt
          cat gdb-ldd.txt
          ! grep libpython gdb-ldd.txt

      # modest -j: downloads are network bound, and more jobs just garble the log
      - name: Install SDKs
        if: env.BUILD_TARGET == 'all'
        run: make -j4 all-sdk

      # vbcc/vlink/vasm plus the vbcc target archives and vc.config
      - name: Build vbcc toolchain
        if: env.BUILD_TARGET == 'all'
        run: make -j $NPROC vbcc vlink

      # target libraries, one copy per multilib
      - name: Build zlib and libpng
        if: env.BUILD_TARGET == 'all'
        run: make -j $NPROC zlib libpng

      # release tarballs are named after the tag (16.2-rc4), which
      # versions the whole distribution rather than just gcc
      - name: Package
        if: env.BUILD_TARGET == 'all'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            make package \
              PACKAGE=m68k-amigaos-gcc-${GITHUB_REF_NAME#v}-$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]').tar.xz
          else
            make package
          fi

      - name: Upload toolchain tarball
        if: env.BUILD_TARGET == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: m68k-amigaos-gcc-${{ env.GCC_VER }}-${{ runner.os }}-${{ runner.arch }}
          path: m68k-amigaos-gcc-*.tar.xz
          compression-level: 0
          if-no-files-found: error

      # the configure logs too: a configure failure only says "see config.log"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ runner.os }}
          path: |
            log/
            build-*/*/config.log
            build-*/newlib/newlib/config.log
          if-no-files-found: ignore

      - name: Install testsuite dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends dejagnu

      - name: Install testsuite dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install dejagnu

      # the volamos* boards run the target tests under this binary, which the
      # Makefile installs into $PREFIX/bin, already on the PATH make exports
      - name: Install volamos
        if: env.SIMULATOR == 'volamos'
        run: make volamos

      - name: Install amitools (vamos)
        if: env.SIMULATOR == 'vamos'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y --no-install-recommends python3-dev python3-venv
          fi
          python3 -m venv $HOME/amitools-venv
          $HOME/amitools-venv/bin/pip install "amitools[vamos] @ $AMITOOLS_GIT"
          echo "$HOME/amitools-venv/bin" >> "$GITHUB_PATH"

      # MULTI and t-amigaos must name the same multilib directories; this
      # only asks the driver, so it runs on every build
      - name: Check the multilib set
        run: make check-multilib

      # gas and ld dump tests for the hunk target; they run on the build
      # machine, no simulator needed
      - name: Run the binutils testsuite
        run: |
          set +e
          make check-binutils
          rc=$?
          { echo '```'; cat check-binutils-gas.summary.txt check-binutils-ld.summary.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      # fast, so it runs on every build
      - name: Run the AmigaOS target testsuite
        run: |
          set +e
          make -j $NPROC check-gcc-amigaos board=$BOARD
          rc=$?
          { echo '```'; cat check-gcc-amigaos.summary.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      # libnix's target tests, against the libnix this build used
      - name: Run the libnix target tests
        if: env.SIMULATOR == 'volamos'
        run: |
          set +e
          make check-libnix
          rc=$?
          { echo '```'; cat check-libnix.summary.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      # The simulator cannot create Exec tasks; link every pthread test here.
      - name: Build the libpthread regression programs
        run: |
          set +e
          make check-libpthread
          rc=$?
          { echo '```'; cat check-libpthread.summary.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: Run the gcc C testsuite
        if: env.RUN_TESTSUITE == 'true' && runner.os == 'Linux'
        run: |
          set +e
          make -j $NPROC check-c board=$BOARD
          rc=$?
          { echo '```'; cat check-c.summary.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      # much slower than the C testsuite, so it is opted into separately
      - name: Run the g++ testsuite
        if: env.RUN_TESTSUITE_CXX == 'true' && runner.os == 'Linux'
        run: |
          set +e
          make -j $NPROC check-c++ board=$BOARD
          rc=$?
          { echo '```'; cat check-c++.summary.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      # a FAIL on either board, or a board without results, fails the step
      - name: Run the newlib testsuite
        if: env.RUN_TESTSUITE_NEWLIB == 'true' && env.SIMULATOR == 'volamos'
        run: |
          set +e
          make -j $NPROC check-newlib
          rc=$?
          { echo '```'; cat check-newlib.summary.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: Upload testsuite results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testsuite-results-${{ runner.os }}
          path: |
            build-*/gcc/gcc/testsuite/gcc/gcc-execute.sum
            build-*/gcc/gcc/testsuite/gcc/gcc-execute.log
            build-*/gcc/gcc/testsuite/gcc/gcc-amigaos.sum
            build-*/gcc/gcc/testsuite/gcc/gcc-amigaos.log
            build-*/gcc/gcc/testsuite/g++/g++.sum
            build-*/gcc/gcc/testsuite/g++/g++.log
            build-*/newlib/newlib/testsuite/*/newlib.sum
            build-*/newlib/newlib/testsuite/*/newlib.log
          if-no-files-found: ignore

  build_amigaos:
    name: Build AmigaOS hosted toolchain
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'ci-amigaos') ||
      (github.event_name != 'pull_request' && inputs.build_hosted)
    # bootstrapped with the cross toolchain the build job just produced, so
    # this exercises the branch's own compiler, assembler and linker rather
    # than a container's copy, and the runner supplies the native compiler
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      PREFIX: ${{ github.workspace }}/output/amigaos/m68k-amigaos-gcc-${{ inputs.gcc_version || '16.2' }}
      HOST: m68k-amigaos
      GCC_VER: ${{ inputs.gcc_version || '16.2' }}

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.checkout_repo }}
          ref: ${{ inputs.checkout_ref }}
          # the Makefile stamps the tools with git describe --tags
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential ca-certificates curl flex \
            gettext git rsync xz-utils

      - name: Download the cross toolchain
        uses: actions/download-artifact@v7
        with:
          name: m68k-amigaos-gcc-${{ env.GCC_VER }}-Linux-X64

      # make package archives from the parent of PREFIX, so the tarball's top
      # directory is the prefix basename: unpacking it in $HOME restores the
      # toolchain at the very path it was configured with, and nothing has to
      # be relocatable
      - name: Unpack it as the bootstrap toolchain
        run: |
          tar -xJf m68k-amigaos-gcc-*.tar.xz -C "$HOME"
          boot="$HOME/m68k-amigaos-gcc-$GCC_VER"
          test "$("$boot/bin/m68k-amigaos-gcc" -dumpmachine)" = "$HOST"
          test -x "$boot/bin/lha"
          # that prefix also carries unprefixed as/ld/ar, so name the host
          # tools by prefix rather than putting its bin/ on PATH, which would
          # shadow the runner's native binutils
          echo "HOST_TOOL_PREFIX=$boot/bin/m68k-amigaos-" >> "$GITHUB_ENV"
          echo "CC=$boot/bin/m68k-amigaos-gcc" >> "$GITHUB_ENV"
          echo "CXX=$boot/bin/m68k-amigaos-g++" >> "$GITHUB_ENV"
          # unpacking the NDK and vbcc archives, and writing the .lha
          # package, both need a build-machine lha: this prefix has one
          echo "LHA_FOR_BUILD=$boot/bin/lha" >> "$GITHUB_ENV"
          echo "PACKAGE_LHA=$boot/bin/lha" >> "$GITHUB_ENV"

      - name: Download the module refs
        uses: actions/download-artifact@v7
        with:
          name: module-refs

      - name: Build AmigaOS hosted toolchain
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          [ -z "$REPOS" ] || sh .github/scripts/override-repos.sh
          make update
          make gcc-prerequisites
          make -j "$(nproc)" all
          make -j 4 all-sdk

      - name: Package AmigaOS hosted toolchain
        run: |
          package_version=$(cat projects/gcc/gcc/BASE-VER)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi
          archive="m68k-amigaos-gcc-${package_version}-m68k-amigaos.lha"
          make package-lha PACKAGE="$GITHUB_WORKSPACE/$archive"
          test -s "$archive"

      - name: Upload AmigaOS package
        uses: actions/upload-artifact@v7
        with:
          name: m68k-amigaos-gcc-hosted-AmigaOS
          path: m68k-amigaos-gcc-*-m68k-amigaos.lha
          compression-level: 0
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-amigaos-hosted
          path: log/
          if-no-files-found: ignore

  build_mingw:
    name: Build MinGW hosted toolchain
    # best effort until the Canadian-cross path issues are fixed: a failure
    # here must not block the release of the other platforms
    continue-on-error: true
    needs: refs
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'ci-mingw') ||
      (github.event_name != 'pull_request' && inputs.build_hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: amigadev/crosstools:x86_64-w64-mingw32
    defaults:
      run:
        shell: bash
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    env:
      PREFIX: ${{ github.workspace }}/output/mingw/m68k-amigaos
      HOST: x86_64-w64-mingw32ucrt
      BUILD_TRIPLET: x86_64-linux-gnu
      HOST_RUNNER: wine
      BUILD_CC: x86_64-linux-gnu-gcc -B/opt/build-binutils/
      BUILD_CXX: x86_64-linux-gnu-g++ -B/opt/build-binutils/
      CC_FOR_BUILD: x86_64-linux-gnu-gcc -B/opt/build-binutils/
      CXX_FOR_BUILD: x86_64-linux-gnu-g++ -B/opt/build-binutils/
      GCC_VER: ${{ inputs.gcc_version || '16.2' }}

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.checkout_repo }}
          ref: ${{ inputs.checkout_ref }}
          # the Makefile stamps the tools with git describe --tags
          fetch-depth: 0

      # the runner checked the tree out as its own user and the container
      # runs as root: git refuses the repository without this
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install host runner
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends wine wine64
          rm -rf /var/lib/apt/lists/*

      - name: Prepare native build tools
        run: |
          mkdir -p /opt/build-binutils
          for tool in as ld gcc g++ ar ranlib strip; do
            ln -sf "/usr/bin/x86_64-linux-gnu-$tool" "/opt/build-binutils/$tool"
          done
          ln -sf /usr/bin/x86_64-linux-gnu-gcc /opt/build-binutils/cc
          ln -sf /usr/bin/x86_64-linux-gnu-g++ /opt/build-binutils/c++
          echo "/opt/build-binutils" >> "$GITHUB_PATH"
          test "$($CC -dumpmachine)" = "$HOST"
          test "$(x86_64-linux-gnu-gcc -dumpmachine)" = "$BUILD_TRIPLET"
          command -v wine
          command -v lha

      - name: Download the module refs
        uses: actions/download-artifact@v7
        with:
          name: module-refs

      - name: Build MinGW hosted toolchain
        id: version
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          [ -z "$REPOS" ] || sh .github/scripts/override-repos.sh
          make update
          make -j "$(nproc)" all
          make -j 4 all-sdk
          package_version=$(cat projects/gcc/gcc/BASE-VER)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Test MinGW hosted compiler
        run: |
          smoke_dir="$RUNNER_TEMP/mingw-smoke"
          wine_home="$RUNNER_TEMP/wine-home"
          wine_runtime="$RUNNER_TEMP/wine-runtime"
          mkdir -p "$smoke_dir" "$wine_home" "$wine_runtime"
          chmod 700 "$wine_runtime"
          export HOME="$wine_home"
          export WINEPREFIX="$wine_home/prefix"
          export XDG_RUNTIME_DIR="$wine_runtime"
          export WINEDEBUG=-all
          export WINEPATH="$(winepath -w "$PREFIX/bin")"
          printf '%s\n' 'int main(void) { return 0; }' > "$smoke_dir/smoke.c"
          smoke_src=$(winepath -w "$smoke_dir/smoke.c")
          smoke_out=$(winepath -w "$smoke_dir/smoke")
          wine "$PREFIX/bin/m68k-amigaos-gcc.exe" \
            -flto -mcrt=nix20 -mcpu=68040 -mhard-float \
            "$smoke_src" -o "$smoke_out"
          test -s "$smoke_dir/smoke"
          gdb_exe="$PREFIX/bin/m68k-amigaos-gdb.exe"
          wine "$gdb_exe" --version || {
            "$HOST-objdump" -p "$gdb_exe" | grep "DLL Name"
            exit 1
          }

      - name: Free build space
        run: |
          make clean
          rm -rf projects download \
            "$RUNNER_TEMP/mingw-smoke" \
            "$RUNNER_TEMP/wine-home" \
            "$RUNNER_TEMP/wine-runtime"

      # Dereference links before crossing the Linux/Windows artifact boundary;
      # the installed Windows tree must contain ordinary files, not Unix links.
      # SDI points at its parent include directory, so materialize that alias
      # before asking tar to dereference the remaining non-recursive links.
      - name: Export Windows toolchain tree
        run: |
          sdi_dir="$PREFIX/m68k-amigaos/include/SDI"
          include_dir=$(dirname "$sdi_dir")
          test -L "$sdi_dir"
          rm "$sdi_dir"
          mkdir "$sdi_dir"
          find "$include_dir" -mindepth 1 -maxdepth 1 ! -name SDI \
            -exec cp -aL -t "$sdi_dir" -- {} +
          tar --dereference -C "$(dirname "$PREFIX")" -cf mingw-prefix.tar "$(basename "$PREFIX")"
          test -s mingw-prefix.tar

      - name: Upload Windows toolchain tree
        uses: actions/upload-artifact@v7
        with:
          name: mingw-prefix-staging
          path: mingw-prefix.tar
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-mingw-hosted
          path: log/
          if-no-files-found: ignore

  package_windows:
    name: Create Windows installer
    continue-on-error: true
    needs: build_mingw
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.build_mingw.outputs.package_version }}
      PACKAGE_BASENAME: m68k-amigaos-gcc-${{ needs.build_mingw.outputs.package_version }}-x86_64-w64-mingw32ucrt

    steps:
      - uses: actions/checkout@v7

      - name: Download Windows toolchain tree
        uses: actions/download-artifact@v7
        with:
          name: mingw-prefix-staging
          path: incoming

      - name: Prepare installer tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging, packages | Out-Null
          tar -xf incoming/mingw-prefix.tar -C staging
          $prefix = (Resolve-Path staging/m68k-amigaos).Path
          Copy-Item setup/cmdline.bat, setup/hello.c $prefix

      # ISCC creates the installer; the generated installer is never executed.
      # Keep a portable zip as a fallback if the hosted runner cannot compile it.
      - name: Compile Windows installer
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -ne $iscc) {
            $iscc = $iscc.Source
          } else {
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "ISCC.exe was not found"
          }
          $env:AMIGA_GCC_VERSION = $env:PACKAGE_VERSION
          $env:AMIGA_GCC_SOURCE_DIR = (Resolve-Path staging/m68k-amigaos).Path
          $output = (Resolve-Path packages).Path
          & $iscc `
            "/O$output" `
            "/F$env:PACKAGE_BASENAME-setup" `
            setup/setup2.iss
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "packages/$env:PACKAGE_BASENAME-setup.exe")) {
            throw "ISCC did not create the expected installer"
          }

      - name: Create portable zip fallback
        if: steps.installer.outcome == 'failure'
        shell: pwsh
        run: |
          Remove-Item packages/*.exe -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/m68k-amigaos `
            -DestinationPath "packages/$env:PACKAGE_BASENAME.zip" `
            -CompressionLevel Optimal
          "Inno Setup failed; publishing the portable zip fallback." >> $env:GITHUB_STEP_SUMMARY

      - name: Verify Windows package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem packages -File)
          if ($packages.Count -ne 1 -or $packages[0].Length -eq 0) {
            throw "Expected one non-empty Windows package, found $($packages.Count)"
          }
          $packages[0].FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: m68k-amigaos-gcc-hosted-Windows
          path: packages/*
          compression-level: 0
          if-no-files-found: error
