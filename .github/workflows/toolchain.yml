name: Bootstrap toolchain

on:
  workflow_dispatch:
    inputs:
      gcc_version:
        description: gcc version to build (branch amiga<version>)
        default: "16.2"
        required: true
      run_testsuite:
        description: run the gcc testsuite under vamos
        type: boolean
        default: false
      amitools_git:
        description: pip source for amitools (vamos)
        default: git+https://github.com/AmigaPorts/amitools.git
      runner:
        description: runner label (e.g. papert for self-hosted)
        default: ubuntu-24.04
  # same inputs again: workflow_call, used by release.yml, does not
  # share the workflow_dispatch input declarations
  workflow_call:
    inputs:
      gcc_version:
        type: string
        default: "16.2"
      run_testsuite:
        type: boolean
        default: false
      amitools_git:
        type: string
        default: git+https://github.com/AmigaPorts/amitools.git
      runner:
        type: string
        default: ubuntu-24.04
  # label a pull request "ci" for a macOS build of its merge commit, or
  # "ci-testsuite" for a Linux build with the gcc testsuite
  pull_request:
    types: [labeled]

jobs:
  build:
    if: github.event_name != 'pull_request' || startsWith(github.event.label.name, 'ci')
    runs-on: ${{ inputs.runner || (github.event.label.name == 'ci' && 'macos-15') || 'ubuntu-24.04' }}
    timeout-minutes: 300
    env:
      RUN_TESTSUITE: ${{ inputs.run_testsuite || github.event.label.name == 'ci-testsuite' }}
      AMITOOLS_GIT: ${{ inputs.amitools_git || 'git+https://github.com/AmigaPorts/amitools.git' }}
      NDK: "3.2"
      # not GCC_VERSION: the Makefile reads that from gcc's BASE-VER
      # (16.2.0b) for gcc's own lib/gcc/<target>/<version> layout
      GCC_VER: ${{ inputs.gcc_version || '16.2' }}
      # aminet.net picks a random mirror per download, some broken or
      # slow; pin one that is fast and healthy from the CI runners
      AMINET_MIRROR: http://nl.aminet.net
    steps:
      - uses: actions/checkout@v7

      # PREFIX and NDK reach every make invocation through the environment
      - name: Set prefix
        run: echo "PREFIX=$HOME/m68k-amigaos-gcc-$GCC_VER" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ca-certificates flex \
            gettext git libgmp-dev libmpfr-dev libmpc-dev libncurses-dev \
            rsync wget xz-utils

      # Apple ships old or BSD versions of most build tools; put the brew
      # GNU ones first on PATH under their plain names (gnubin) so the
      # build machinery does not need BSD workarounds
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake bison coreutils flex gettext \
            gmp gnu-sed gnu-tar grep make mpfr libmpc wget xz
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          for pkg in coreutils gnu-sed gnu-tar grep make; do
            echo "$(brew --prefix $pkg)/libexec/gnubin" >> $GITHUB_PATH
          done

      - name: Set build parallelism
        run: echo "NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >> $GITHUB_ENV

      - name: Select gcc branch
        run: make branch branch=amiga$GCC_VER mod=gcc

      - name: Fetch sources
        run: make update

      - name: Build toolchain
        run: make -j $NPROC all MAKEINFO=true

      # modest -j: downloads are network bound, and more jobs just garble the log
      - name: Install SDKs
        run: make -j4 all-sdk MAKEINFO=true

      # vbcc/vlink/vasm plus the vbcc target archives and vc.config
      - name: Build vbcc toolchain
        run: make -j $NPROC vbcc vlink MAKEINFO=true

      # release tarballs are named after the tag (16.2-rc4), which
      # versions the whole distribution rather than just gcc
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            make package \
              PACKAGE=m68k-amigaos-gcc-${GITHUB_REF_NAME#v}-$(uname -s)-$(uname -m).tar.xz
          else
            make package
          fi

      - name: Upload toolchain tarball
        uses: actions/upload-artifact@v7
        with:
          name: m68k-amigaos-gcc-${{ env.GCC_VER }}-${{ runner.os }}-${{ runner.arch }}
          path: m68k-amigaos-gcc-*.tar.xz
          compression-level: 0
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ runner.os }}
          path: log/
          if-no-files-found: ignore

      # the vamos testsuite setup is Linux-only for now
      - name: Install testsuite dependencies
        if: env.RUN_TESTSUITE == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends dejagnu python3-dev python3-venv
          python3 -m venv $HOME/amitools-venv
          $HOME/amitools-venv/bin/pip install "amitools[vamos] @ $AMITOOLS_GIT"

      - name: Run the gcc testsuite
        if: env.RUN_TESTSUITE == 'true' && runner.os == 'Linux'
        run: |
          env DEJAGNU=$PWD/dejagnu-site.exp PATH="$HOME/amitools-venv/bin:$PATH" \
            make -j $NPROC check MAKEINFO=true

      - name: Testsuite summary
        if: always() && env.RUN_TESTSUITE == 'true' && runner.os == 'Linux'
        run: |
          sum=$(ls build-*/gcc/gcc/testsuite/gcc/gcc.sum) || exit 0
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A6 "=== gcc Summary ===" "$sum" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          grep "^FAIL\|^ERROR" "$sum" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload testsuite results
        if: always() && env.RUN_TESTSUITE == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: testsuite-results
          path: |
            build-*/gcc/gcc/testsuite/gcc/gcc.sum
            build-*/gcc/gcc/testsuite/gcc/gcc.log
          if-no-files-found: ignore
