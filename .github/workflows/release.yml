name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Bootstrap the toolchain and run the gcc testsuite as a release gate.
  # This invocation also creates the AmigaOS and Windows hosted packages.
  build-linux:
    uses: ./.github/workflows/toolchain.yml
    with:
      run_testsuite: true

  # the testsuite only runs on Linux; the macOS build gates on compiling
  build-macos:
    uses: ./.github/workflows/toolchain.yml
    with:
      build_linux: false
      build_macos: true
      build_hosted: false

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download toolchain packages
        uses: actions/download-artifact@v7
        with:
          pattern: m68k-amigaos-gcc-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag's message body becomes the prose at the top of the
          # release; write it with "git tag -a -e". The script appends the
          # "What's Changed" PR list and the collapsed commit list, and can
          # be run locally to preview the notes before pushing a tag.
          # --notes-file, so a tag message or commit subject can never be
          # read as workflow syntax the way a $GITHUB_OUTPUT heredoc can.
          .github/scripts/gen-release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" m68k-amigaos-gcc-* \
            --title "Release ${TAG#v}" --notes-file notes.md
